  - heading "What digital marketing services does NativeCode offer?" [level=3]
  - paragraph: NativeCode offers SEO and AI search, website design and development, Shopify and ecommerce builds, paid media on Google, Meta, TikTok and LinkedIn, email marketing, analytics and conversion work, and local SEO. Each service has its own page, listed above, with scope, process and common questions.
  - heading "Do I need more than one service?" [level=3]
  - paragraph: Often, but not always. Many projects pair two or three, such as a website rebuild with SEO, or paid ads with conversion tracking. We recommend a starting point after a free audit, so you only pay for the work that will move results first.
  - heading "Do you work with businesses outside Atlanta?" [level=3]
  - paragraph: Yes. NativeCode is Atlanta-based, with its office in Norcross, and works with clients across the US. Most programs run remotely on shared reports and regular calls.
  - heading "How do I choose where to start?" [level=3]
  - paragraph: Start with the free audit. We review your site, search visibility and tracking, then send a written plan that ranks the fixes by revenue impact. That plan shows which service to start with and what it involves.
  - paragraph: Where to start
  - heading "Not sure which service you need?" [level=2]
  - paragraph: Tell us what you want to grow and we will point you to the right starting place, in writing.
