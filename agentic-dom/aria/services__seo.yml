  - heading "How long does SEO take to work?" [level=3]
  - paragraph: Most sites see technical fixes picked up within weeks of release, while content and authority work builds over several months. The timeline depends on your starting point, your competition and how quickly changes ship. We report monthly so you can see what is moving and what is next.
  - heading "What is the difference between SEO and AEO?" [level=3]
  - paragraph: SEO earns rankings in classic search results. AEO, or answer engine optimization, earns mentions and citations in AI answers such as Google AI Overviews, ChatGPT and Perplexity. Both depend on clear structure, schema and trusted content, so we run them as one program rather than two.
  - heading "Do you work with in-house teams and developers?" [level=3]
  - paragraph: Yes. We work alongside in-house marketing, content and engineering teams every week. We can implement changes ourselves on Shopify, Webflow and WordPress, or write clear specs and tickets your developers can build from. Before each release we check the work on staging so nothing ships that could hurt rankings.
  - heading "How do you report on SEO results?" [level=3]
  - paragraph: "We report monthly on the numbers that matter to the business: organic leads and revenue, traffic to key pages, rankings for target searches and AI answer visibility. Reports come from GA4 and Search Console, with a short list of what we will do next."
  - heading "Are you an Atlanta SEO company or a national agency?" [level=3]
  - paragraph: Both. NativeCode is based in the Atlanta metro area, with an office in Norcross, and serves clients across the United States. Most engagements run remotely with scheduled calls and shared reporting. Atlanta clients can also meet in person. Local businesses can start with our local SEO service.
