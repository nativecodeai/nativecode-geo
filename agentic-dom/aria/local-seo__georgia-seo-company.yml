  - paragraph: Searching in Georgia
  - heading "How do Georgia customers search for local businesses?" [level=2]
  - paragraph: Georgia search is metro Atlanta plus distinct regional markets. Fulton, DeKalb, Cobb and Gwinnett anchor metro Atlanta. Augusta, Columbus and northwest Georgia reach across state lines, while Savannah and the Golden Isles serve coastal visitors.
  - paragraph: "01"
  - heading "Metro Atlanta's many cities" [level=3]
  - paragraph: Marietta, Alpharetta, Sandy Springs, Decatur and Lawrenceville each return their own map results. An intown Atlanta address alone rarely reaches all of them in Google Maps.
  - paragraph: "02"
  - heading "Augusta, Columbus and Chattanooga" [level=3]
  - paragraph: Augusta shares customers with North Augusta, South Carolina, and Columbus with Phenix City, Alabama. Northwest Georgia towns like Ringgold and Fort Oglethorpe sit in the Chattanooga market.
  - paragraph: "03"
  - heading "Coast and mountain tourism" [level=3]
  - paragraph: Savannah, Tybee Island and the Golden Isles draw coastal visitors, while Blue Ridge, Helen and Dahlonega draw mountain trips. Seasonal hours and photos shape which listing travelers pick.
