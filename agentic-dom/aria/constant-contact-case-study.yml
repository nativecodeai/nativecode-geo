  - paragraph: "01"
  - heading "What did Constant Contact need?" [level=2]
  - paragraph: Constant Contact wanted search visibility that does more than drive traffic. Every page had to answer a real question, earn citations in AI answers from Google, ChatGPT and Perplexity, and point the reader to one destination, such as a partner signup or a connected integration.
  - paragraph: "02"
  - heading "How is the program structured?" [level=2]
  - paragraph: The work runs in tracks, each built around one audience and one destination. Anchor guides hold the main question in a search group, and supporting pieces each answer one question completely and link back. The same audiences are covered on the blog and in the Constant Contact Community, written in the peer-to-peer voice of the boards.
  - paragraph: Program model
