  - paragraph: "03"
  - heading "How is each page built to be quoted?" [level=2]
  - paragraph: A page can rank and still never be cited. Every piece opens with a complete answer in forty to sixty words, uses the questions people actually type as headings, sets comparisons in tables, names products in full and dates its claims, so answer engines can lift it and verify it.
  - paragraph: "04"
  - heading "Growth programs" [level=2]
  - paragraph: The engagement has grown into an organic discoverability program around the Canva and Constant Contact integration, covering search, AI answers, content and destination pages, with monthly reporting on rankings, share of answer and conversion.
  - heading "Program results on request" [level=2]
  - paragraph: Performance figures are shared in a walkthrough, with the client's approval.
