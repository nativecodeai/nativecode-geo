- main:
  - paragraph: About NativeCode
  - heading "One senior team for search, web, creative and growth." [level=1]
  - paragraph: NativeCode is an Atlanta-based digital marketing and engineering firm that runs SEO, AI search, web design and development, paid media, email and creative as one program for brands nationwide. The people who plan the work are the people who do it, and every program is reported against revenue.
  - link "Start a project":
    - /url: /company/contact
  - link "See services":
    - /url: /#services
  - paragraph: How we work
  - heading "How does NativeCode work?" [level=2]
  - paragraph: Search, AI discovery and paid channels change every year. What lasts is clear architecture, honest measurement and a team that owns the outcome.
  - paragraph: "01"
  - heading "Senior-led" [level=3]
  - paragraph: Experienced practitioners run every engagement. No account-manager layer between you and the people doing the work.
  - paragraph: "02"
  - heading "One program" [level=3]
  - paragraph: Strategy, execution and reporting treated as one system, so search, ads, email and the website pull in the same direction.
  - paragraph: "03"
  - heading "An extension of your team" [level=3]
  - paragraph: We work with founders, marketing leaders, product and engineering, inside your tools and your planning cycle.
  - paragraph: What we cover
  - heading "What services does NativeCode offer?" [level=2]
  - paragraph: Search
  - heading "SEO and AI search" [level=3]
  - paragraph: SEO architecture, AI search and AEO, topic clusters and link building.
  - paragraph: Web
  - heading "Design and development" [level=3]
  - paragraph: Webflow sites, Shopify stores, and interactive tools and apps.
  - paragraph: Growth
  - heading "Paid, email and CRO" [level=3]
  - paragraph: Google and Meta Ads, email marketing, conversion optimization and partner programs.
  - paragraph: Creative
  - heading "Creative and video" [level=3]
  - paragraph: Ad creative, product imagery and short-form video, tested against live spend.
  - paragraph: Proof
  - heading "Our products are our case studies." [level=2]
  - paragraph: We design, build and rank our own products with the same methods we use for clients. They are live and you can check them.
  - paragraph: Health and nutrition
