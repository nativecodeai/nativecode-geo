  - paragraph: Overview
  - heading "What TDEE.co is" [level=2]
  - paragraph: "TDEE.co answers the question behind every diet and training plan: how many calories do I actually burn in a day? It estimates basal metabolic rate with the Mifflin-St Jeor equation, switches to Katch-McArdle when a body-fat percentage is supplied, and multiplies by an honest activity factor between 1.2 and 1.9."
  - paragraph: Every number the site produces lives on the same axis (resting burn, activity energy, the maintenance line, a goal deficit or surplus, and a macro split), so a visitor can see how one result becomes the next rather than juggling seven unrelated calculators.
  - paragraph: "The page is medically reviewed, cites its equations, and is structured for answer engines: fifteen definition-first FAQs written to be quoted, a formula shown in full, and an accuracy section that says plainly what a calculator cannot see."
  - paragraph: Inside the product
  - heading "The elements a visitor actually uses" [level=2]
  - paragraph: Each card names a real element on tdee.co and reproduces a sample readout from it, so the page shows the product rather than describing it.
  - article:
    - heading "The energy readout" [level=3]
    - paragraph: "The headline result: total daily energy expenditure, split into the share that is resting metabolism and the share added by movement and digestion."
    - term: Your TDEE
    - definition: 2,640 kcal / day
    - term: Resting (BMR)
    - definition: 1,640 · 62%
    - term: Activity & digestion
    - definition: 38%
  - article:
    - heading "Goal table" [level=3]
    - paragraph: Four calorie targets derived from the same maintenance line, each labelled with the pace of change it implies.
    - term: Aggressive loss ~1.5 lb/wk
    - definition: 1,980
    - term: Weight loss ~1 lb/wk
    - definition: 2,140
    - term: Maintain
    - definition: 2,640
    - term: Lean gain ~0.5 lb/wk
    - definition: 2,890
  - article:
    - heading "Suggested macros" [level=3]
    - paragraph: Protein set first to protect lean mass, then carbohydrate and fat divided across the remaining calories, with a one-tap copy of the full result.
    - term: Protein
