  - paragraph: Method
  - heading "The math, stated plainly" [level=2]
  - paragraph: Every NativeCode product publishes its assumptions on the page. This is the sequence the engine follows.
  - list:
    - listitem:
      - text: "01"
      - heading "Estimate resting burn" [level=3]
      - code: BMR = 10·kg + 6.25·cm − 5·age + 5 (men) / − 161 (women)
      - paragraph: Mifflin-St Jeor is the default, recognised by the Academy of Nutrition and Dietetics as the most accurate general-population equation.
    - listitem:
      - text: "02"
      - heading "Scale by activity" [level=3]
      - code: TDEE = BMR × 1.2 … 1.9
      - paragraph: The multiplier is the single biggest variable. The site tells people to match an average week, not a best one. A desk job plus four hard sessions is ×1.55.
    - listitem:
      - text: "03"
      - heading "Refine with body fat" [level=3]
      - code: BMR = 370 + 21.6 × lean mass (kg)
      - paragraph: Entering a body-fat percentage switches the engine to Katch-McArdle, which is driven by lean mass rather than total weight.
    - listitem:
      - text: "04"
      - heading "Steer to a goal" [level=3]
      - code: −500 → ~1 lb/wk · +250 → lean gain
      - paragraph: Deficits and surpluses are applied to the maintenance line, with a low-calorie warning threshold of about 1,200 (women) and 1,500 (men).
