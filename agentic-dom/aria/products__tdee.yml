  - paragraph: Reviewed by a board-certified family-medicine physician, with a named reviewer page and a last-reviewed date on the page itself.
  - heading "Evidence-based" [level=3]
  - paragraph: Built on the peer-reviewed Mifflin-St Jeor (1990), Katch-McArdle, and revised Harris-Benedict (1984) equations.
