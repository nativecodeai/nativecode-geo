- main:
  - paragraph: Careers
  - 'heading "Careers at NativeCode: help us grow the agency." [level=1]'
  - paragraph: NativeCode is an Atlanta-based digital marketing agency, and we are adding senior specialists in client strategy, business development, paid media, email, technical SEO and web development. Every open role is remote within the US and works directly with our leadership and delivery team.
  - link "See open roles":
    - /url: "#roles"
  - link "Get in touch":
    - /url: mailto:mailto:career@nativecode.ai?subject=Careers
  - paragraph: How we work
  - heading "What is it like to work at NativeCode?" [level=2]
  - paragraph: You work directly with senior strategists, engineers and decision-makers on problems that matter to the client’s business.
  - paragraph: "01"
  - heading "Work that moves the business" [level=3]
  - paragraph: You work with senior strategists, engineers and client decision-makers on search, ads, email and web problems tied to real revenue and pipeline.
  - paragraph: "02"
  - heading "Clear scopes, fair rates" [level=3]
  - paragraph: Every engagement starts with an agreed scope, availability and rate. Compensation reflects seniority, contribution and results.
  - paragraph: "03"
  - heading "Remote and async-friendly" [level=3]
  - paragraph: Work from anywhere in the US. Meetings are planned and kept short, so there is room for deep, focused work.
  - paragraph: Open roles
  - heading "What roles are open?" [level=2]
  - paragraph: All roles are remote within the US and engaged as independent contractors, on a fractional or project basis. Open a role to read the full description and apply.
  - link "Fractional · Remote, US Client Strategy Lead, Digital Marketing Lead client meetings and communication across SEO, content marketing and paid media engagements. View role and apply":
    - /url: /jobs/client-strategy-lead-paid-media-seo
    - paragraph: Fractional · Remote, US
    - heading "Client Strategy Lead, Digital Marketing" [level=3]
    - paragraph: Lead client meetings and communication across SEO, content marketing and paid media engagements.
    - paragraph: View role and apply
