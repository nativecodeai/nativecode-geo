  - paragraph: FAQ
  - heading "Questions about working with NativeCode" [level=2]
  - paragraph: Still have a question?
  - paragraph: Ask the senior strategist who would run your program.
  - link "Start a project":
    - /url: /company/contact
  - link "(800) 618-6053":
    - /url: tel:+18006186053
  - heading "Are NativeCode jobs remote?" [level=3]
  - paragraph: Yes. All current roles are remote within the US. Some roles, such as the Client Strategy Lead, need availability during US Eastern business hours for client meetings.
  - heading "Are these full-time jobs?" [level=3]
  - paragraph: Current openings are fractional or contract roles for independent contractors. Scope, hours and rates are agreed with each person based on the work and their availability.
  - heading "How do I apply?" [level=3]
  - paragraph: Open the role, read the full description and use the application form on that page. Include your LinkedIn profile or portfolio and a short note on your most relevant work.
  - heading "What happens after I apply?" [level=3]
  - paragraph: Applications are reviewed against the role. If there is a fit, we set up a short video call, then agree on scope, availability and rates.
  - heading "What if none of the roles fit?" [level=3]
  - paragraph: Email career@nativecode.ai with Careers in the subject line, a link to your work and a few lines on what you do best.
