  - paragraph: FAQ
  - heading "Questions before you start." [level=2]
  - paragraph: Straight answers on the free audit, who does the work and how projects are priced.
  - heading "Is the audit really free?" [level=3]
  - paragraph: Yes. The audit is free and carries no obligation. A senior strategist reviews your site, search visibility, AI answer presence and tracking, then sends back the issues, the fixes ranked by revenue impact and what we would do first. You keep the findings whether or not you hire us.
  - heading "Who does the work?" [level=3]
  - paragraph: Senior strategists and specialists do the work. The people you meet on the first call are the people who plan, build and report on your program across SEO, AI search, web, paid media and email. There are no junior handoffs and no account-manager layer between you and the team.
  - heading "Do you work outside Atlanta?" [level=3]
  - paragraph: Yes. NativeCode is based in Atlanta, with an office in Norcross, and works with businesses across the United States. Most work runs remotely inside your own tools and accounts, with video calls for planning and reviews. Clients in metro Atlanta can also meet in person when that helps.
  - heading "Can you work with our in-house team?" [level=3]
  - paragraph: Yes. We can run the whole program, build alongside your marketing, product and engineering teams, or advise and review work your team runs. We work inside your Google Ads, GA4, Search Console, Shopify, Webflow and email platform accounts, so the work and the data stay with you.
  - heading "How is pricing set?" [level=3]
  - paragraph: Every engagement is scoped after the free audit. You get a written scope, timeline and price before any work starts, based on the channels involved, the size of your site and how much your own team handles. Growth programs, projects and advisory work are each scoped separately.
