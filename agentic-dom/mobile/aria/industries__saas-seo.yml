  - paragraph: FAQ
  - heading "SaaS SEO questions" [level=2]
  - heading "What should a SaaS company publish first?" [level=3]
  - paragraph: "A SaaS company should publish pages that match buying intent first: use-case, comparison and integration pages. They sit closer to a signup or demo than general blog posts, and they give later content something to link to. Broad educational posts come after the pages that convert are in place."
  - heading "Are comparison pages worth it?" [level=3]
  - paragraph: Yes, when they are honest. Buyers search for alternatives late in their research, and a fair page that explains where each product fits earns trust and links. Pages that only attack competitors tend to lose that trust and rarely get cited by AI tools as a neutral source.
  - heading "Should docs live on a subdomain?" [level=3]
  - paragraph: Either can work. What matters is that docs get clear structure, crawlable content and links to product pages. For developer products, an llms.txt file at the docs root helps AI coding tools find the right pages. We review the current setup before recommending a move.
  - heading "How do you measure AI visibility for SaaS?" [level=3]
  - paragraph: We track a fixed set of category and comparison prompts in ChatGPT, Perplexity and Google AI Overviews each month. For each one we record whether the product is mentioned, cited and linked, and which sources the answer relied on, so content work can target the gaps.
  - paragraph: SaaS
  - heading "Get your product on the AI shortlist." [level=2]
  - paragraph: Tell us your category and your main competitors. We will show you where buyers find them and not you.
