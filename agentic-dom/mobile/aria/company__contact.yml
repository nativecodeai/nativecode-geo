  - paragraph: FAQ
  - heading "What should you know before you reach out?" [level=2]
  - heading "How much does it cost to work with NativeCode?" [level=3]
  - paragraph: It depends on scope. After a free audit or a discovery call, a senior strategist sends a written proposal with the scope, timeline and price before any work starts. SEO and AI search programs, paid media, email and web builds are each scoped to your goals, site and team. Share your budget range in the form and we will shape the proposal around it.
  - heading "Do you work with companies outside Atlanta?" [level=3]
  - paragraph: Yes. NativeCode is based in Atlanta, with an office in Norcross, and works with teams across the United States and in other countries. Most work runs remotely inside your own tools and accounts, with video calls for planning and reviews. Clients in metro Atlanta can also meet in person when that helps.
  - heading "What should I include in my message?" [level=3]
  - paragraph: Include your goals, the channels you run today, rough traffic or revenue figures if you can share them, and any deadline or launch date. Links to your site, your current reports and the platforms you use, such as Shopify, Webflow, GA4 or Klaviyo, help us come to the first call prepared with a point of view.
  - heading "Can you work inside our existing accounts?" [level=3]
  - paragraph: Yes. We build in your Google Ads, Meta, GA4, Search Console, Shopify, Webflow and email platform accounts, so the work and the data stay yours. Access is scoped to what the engagement needs and is read-only where possible. Our Security and trust page explains how we handle accounts, devices and client information.
  - heading "I am an existing client. Where do I go?" [level=3]
  - paragraph: Email your project lead directly for anything about an active engagement. If you are not sure who that is, write to hello@nativecode.ai with your company name in the subject line and we will route it to the right person. For security or vendor-risk questions, email security@nativecode.ai instead.
