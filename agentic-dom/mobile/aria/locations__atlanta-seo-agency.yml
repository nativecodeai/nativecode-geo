  - paragraph: Searching in Atlanta
  - heading "How do Atlanta customers search for local businesses?" [level=2]
  - paragraph: Atlanta customers search neighborhood by neighborhood, so map results shift from one part of the city to the next and most categories have strong, established competitors.
  - paragraph: "01"
  - heading "Neighborhood searches" [level=3]
  - paragraph: People search by area, from Midtown and Buckhead to Old Fourth Ward and West Midtown. Your pages and profile need to match how they search.
  - paragraph: "02"
  - heading "Inside and outside the Perimeter" [level=3]
  - paragraph: Customers come from ITP and OTP alike. Service area pages help you reach the suburbs your map listing does not.
  - paragraph: "03"
  - heading "Close competition" [level=3]
  - paragraph: With many strong competitors in most categories, profile quality, reviews and local links decide who takes the top three map spots.
