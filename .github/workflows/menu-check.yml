name: Menu check

on:
  workflow_dispatch:
    inputs:
      base:
        default: "https://nativecodeai.webflow.io"
      path:
        default: "/"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agentic-dom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/menu-check.ts "$BASE" "$P"
        env:
          BASE: ${{ inputs.base }}
          P: ${{ inputs.path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-shots
          path: agentic-dom/menu-shots
      - name: Push screenshots to the menu-shots branch
        if: always()
        working-directory: agentic-dom/menu-shots
        run: |
          git init -q && git checkout -q -b menu-shots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Menu check screenshots ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" menu-shots
