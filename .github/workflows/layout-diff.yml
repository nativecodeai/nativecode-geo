name: Layout diff

# Compares page layout between two hosts (default: production vs Webflow staging)
# so a structural change can be proven invisible before it is published live.
on:
  workflow_dispatch:
    inputs:
      a:
        description: "Baseline host"
        default: "https://www.nativecode.ai"
      b:
        description: "Candidate host"
        default: "https://nativecodeai.webflow.io"
      paths:
        description: "Space-separated paths to check instead of the default list"
        default: ""

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agentic-dom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diff
        run: |
          if [ -n "${PATHS}" ]; then
            for p in ${PATHS}; do echo "https://x${p}"; done > urls.txt
          else
            cp nativecode-urls.txt urls.txt
            printf '%s\n' "https://x/jobs/client-strategy-lead-paid-media-seo" "https://x/services/technical-seo" >> urls.txt
          fi
          npx tsx src/layout-diff.ts --a "${{ inputs.a }}" --b "${{ inputs.b }}" --urls urls.txt --out out/layout-diff.json
        env:
          PATHS: ${{ inputs.paths }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-diff
          path: agentic-dom/out/layout-diff.json
